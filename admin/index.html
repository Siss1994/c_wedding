<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>관리자 · 박창근 ♥ 정보람</title>
<script>try{if(sessionStorage.getItem('wc_admin_pw'))document.documentElement.classList.add('autologin')}catch(e){}</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    background: #0d0b14; color: #eae3f0; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }
  /* 로그인 */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 22px; }
  #boot { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #0d0b14; color: #9c8fb0; font-size: .85rem; z-index: 100; }
  #boot .dot { width: 8px; height: 8px; border-radius: 50%; background: #9b7bd4; margin-right: 8px;
    animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  html.autologin #login { display: none; }
  html.autologin #boot { display: flex; }
  .login-card { width: 100%; max-width: 340px; background: linear-gradient(160deg,#20182b,#140f1e);
    border: 1px solid rgba(180,150,220,.2); border-radius: 16px; padding: 30px 24px; }
  .login-card h1 { font-size: 1.05rem; text-align: center; margin-bottom: 4px; font-weight: 700; }
  .login-card p.sub { font-size: .78rem; color: #9c8fb0; text-align: center; margin-bottom: 20px; }
  input[type=password] { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05); color: #fff; font-size: .95rem; outline: none; }
  input[type=password]:focus { border-color: #a78bd0; }
  .btn { width: 100%; margin-top: 12px; padding: 13px; border: none; border-radius: 10px; cursor: pointer;
    background: #9b7bd4; color: #150e22; font-weight: 700; font-size: .92rem; font-family: inherit;
    transition: transform .12s, filter .2s; }
  .btn:active { transform: scale(.96); } .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: rgba(255,255,255,.08); color: #cdbfe0; font-weight: 500; }
  .msg { text-align: center; font-size: .8rem; margin-top: 12px; min-height: 1em; color: #e79a9a; }
  /* 대시보드 */
  #dash { display: none; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .top h1 { font-size: 1.15rem; } .top .btn { width: auto; margin: 0; padding: 8px 14px; font-size: .8rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin-bottom: 22px; }
  .card { background: linear-gradient(160deg,#1c1628,#151020); border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px; padding: 16px 16px 14px; }
  .card .k { font-size: .72rem; color: #9c8fb0; margin-bottom: 6px; }
  .card .v { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; }
  .card .v small { font-size: .8rem; color: #b3a6c7; font-weight: 500; }
  .sec { margin-bottom: 28px; }
  .sec h2 { font-size: .92rem; margin-bottom: 12px; color: #d9cdea; display: flex; gap: 8px; align-items: baseline; }
  .sec h2 span { font-size: .74rem; color: #8d80a3; font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,.06); white-space: nowrap; }
  th { color: #9c8fb0; font-weight: 500; font-size: .74rem; }
  td.num, th.num { text-align: right; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .72rem; }
  .tag.g { background: rgba(120,150,230,.18); color: #a9bdf0; }
  .tag.b { background: rgba(230,150,190,.18); color: #f0aecf; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid rgba(255,255,255,.07); border-radius: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: .78rem; margin: 5px 0; }
  .bar-row .lbl { width: 90px; color: #b3a6c7; flex-shrink: 0; }
  .bar-row .track { flex: 1; height: 8px; background: rgba(255,255,255,.06); border-radius: 6px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: linear-gradient(90deg,#8f6fd0,#c79ad8); border-radius: 6px; }
  .bar-row .n { width: 46px; text-align: right; color: #d9cdea; }
  .muted { color: #8d80a3; font-size: .8rem; padding: 14px 4px; }
  .filters { display: flex; gap: 6px; margin-bottom: 10px; }
  .chip { padding: 6px 13px; border-radius: 20px; font-size: .76rem; cursor: pointer; font-family: inherit;
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: #b3a6c7; transition: all .15s; }
  .chip.on { background: #9b7bd4; color: #150e22; border-color: transparent; font-weight: 600; }
  th.act, td.act { text-align: center; width: 42px; }
  .del-btn { border: none; background: rgba(230,120,120,.16); color: #ec8a8a; width: 27px; height: 27px;
    border-radius: 7px; cursor: pointer; font-size: 1rem; line-height: 1; transition: transform .1s, filter .2s; }
  .del-btn:active { transform: scale(.88); } .del-btn:hover { filter: brightness(1.15); }
  .lbl-btn { border: none; background: rgba(255,255,255,.06); color: #b3a6c7; padding: 4px 10px; border-radius: 7px;
    font-size: .76rem; cursor: pointer; font-family: inherit; max-width: 120px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; transition: transform .1s, filter .2s; }
  .lbl-btn.named { background: rgba(120,150,230,.22); color: #c7d4f5; font-weight: 600; }
  .lbl-btn:hover { filter: brightness(1.15); } .lbl-btn:active { transform: scale(.94); }
  #namemodal { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center;
    background: rgba(8,5,14,.72); padding: 22px; }
  #namemodal.on { display: flex; }
  #name-input { width: 100%; padding: 12px 13px; border-radius: 9px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05); color: #fff; font-size: .92rem; outline: none; box-sizing: border-box; }
  #name-input:focus { border-color: #9b7bd4; }
  .nm-sub { font-size: .72rem; color: #8d80a3; margin: 6px 0 0; word-break: break-all; }
  #confirm { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center;
    background: rgba(8,5,14,.72); padding: 22px; }
  #confirm.on { display: flex; }
  .confirm-card { background: linear-gradient(160deg,#20182b,#140f1e); border: 1px solid rgba(180,150,220,.25);
    border-radius: 16px; padding: 26px 22px 22px; max-width: 300px; width: 100%; text-align: center; }
  .confirm-card p { font-size: .92rem; margin-bottom: 20px; line-height: 1.7; }
  .confirm-card .row { display: flex; gap: 8px; }
  .confirm-card .btn { margin-top: 0; }
</style>
</head>
<body>
  <div id="boot"><span class="dot"></span>불러오는 중…</div>

  <!-- 로그인 -->
  <div id="login">
    <form class="login-card" id="login-form">
      <h1>관리자 대시보드</h1>
      <p class="sub">박창근 ♥ 정보람 · 청첩장</p>
      <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" />
      <button class="btn" type="submit" id="login-btn">로그인</button>
      <p class="msg" id="login-msg"></p>
    </form>
  </div>

  <!-- 대시보드 -->
  <div id="dash">
    <div class="wrap">
      <div class="top">
        <h1>대시보드</h1>
        <div style="display:flex;gap:8px">
          <button class="btn ghost" id="refresh">새로고침</button>
          <button class="btn ghost" id="logout">로그아웃</button>
        </div>
      </div>
      <div class="cards" id="cards"></div>

      <div class="sec">
        <h2>참석 응답 <span id="rsvp-sum"></span></h2>
        <div class="filters" id="rsvp-filters">
          <button class="chip on" data-f="all">전체</button>
          <button class="chip" data-f="신랑측">신랑측</button>
          <button class="chip" data-f="신부측">신부측</button>
        </div>
        <div class="scroll"><table id="rsvp-tbl"><thead><tr><th>구분</th><th>성함</th><th class="num">인원</th><th>신청 시간</th><th class="act"></th></tr></thead><tbody></tbody></table></div>
      </div>

      <div class="sec">
        <h2>방문 통계</h2>
        <div id="devices"></div>
      </div>

      <div class="sec">
        <h2>일자별 방문 <span>(순 방문자 기준)</span></h2>
        <div id="timeline"></div>
      </div>

      <div class="sec">
        <h2>최근 방문 <span id="visit-sum"></span></h2>
        <div class="scroll"><table id="visit-tbl"><thead><tr><th>시간</th><th>IP</th><th>기기</th><th>유저</th></tr></thead><tbody></tbody></table></div>
      </div>
    </div>
  </div>

  <!-- 방문자 이름 지정/변경 -->
  <div id="namemodal">
    <div class="confirm-card" style="max-width:320px">
      <p style="margin-bottom:12px">방문자 이름 지정</p>
      <input type="text" id="name-input" placeholder="이름 (예: 외삼촌, 김과장)" maxlength="20" autocomplete="off" />
      <p class="nm-sub" id="name-vid"></p>
      <div class="row" style="margin-top:16px">
        <button class="btn ghost" id="name-cancel" type="button">취소</button>
        <button class="btn" id="name-save" type="button">저장</button>
      </div>
      <button class="btn ghost" id="name-clear" type="button" style="margin-top:8px;width:100%">이름 삭제</button>
    </div>
  </div>

  <!-- 삭제 확인 -->
  <div id="confirm">
    <div class="confirm-card">
      <p id="confirm-msg">삭제하겠습니까?</p>
      <div class="row">
        <button class="btn ghost" id="confirm-no" type="button">아니오</button>
        <button class="btn" id="confirm-yes" type="button">예</button>
      </div>
    </div>
  </div>

<script>
const FN = 'https://cmurtsryrjkwuqwnukdv.supabase.co/functions/v1/admin'
const $ = s => document.querySelector(s)
let ALL_RSVP = [], ALL_VISITS = [], LABELS = {}, FILTER = 'all', PW = '', pendingDelId = null, pendingVid = null
const fmt = t => { const d = new Date(t); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()-2000}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` }
const dayKey = t => { const d = new Date(t); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}` }
function device(ua='') {
  ua = ua || ''
  if (/iPhone/i.test(ua)) return 'iPhone'
  if (/iPad/i.test(ua)) return 'iPad'
  if (/Android/i.test(ua)) return /Mobile/i.test(ua) ? 'Android폰' : 'Android태블릿'
  if (/Windows/i.test(ua)) return 'Windows'
  if (/Macintosh|Mac OS/i.test(ua)) return 'Mac'
  if (/Linux/i.test(ua)) return 'Linux'
  return '기타'
}
function isMobile(ua='') { return /Mobi|Android|iPhone|iPad/i.test(ua) }

async function login(pw) {
  const res = await fetch(FN, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) })
  const data = await res.json().catch(()=>({}))
  return { ok: res.ok && data.ok, status: res.status, data }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) }

function renderRsvp() {
  const rsvp = ALL_RSVP
  const agg = { '신랑측': 0, '신부측': 0 }
  rsvp.forEach(r => { agg[r.side] = (agg[r.side] || 0) + (r.count || 0) })
  $('#rsvp-sum').textContent = `신랑측 ${agg['신랑측'] || 0}명 · 신부측 ${agg['신부측'] || 0}명`
  const list = FILTER === 'all' ? rsvp : rsvp.filter(r => r.side === FILTER)
  $('#rsvp-tbl tbody').innerHTML = list.length ? list.map(r => `<tr>
    <td><span class="tag ${r.side === '신부측' ? 'b' : 'g'}">${esc(r.side)}</span></td>
    <td>${esc(r.name)}</td><td class="num">${r.count || 0}</td><td>${fmt(r.created_at)}</td>
    <td class="act"><button class="del-btn" data-id="${r.id}" data-name="${esc(r.name)}" title="삭제">×</button></td></tr>`).join('')
    : `<tr><td colspan="5" class="muted">${FILTER === 'all' ? '아직 응답이 없습니다.' : '해당 구분의 응답이 없습니다.'}</td></tr>`
}

function render({ rsvp, visits, labels }) {
  rsvp = rsvp || []; visits = visits || []
  ALL_RSVP = rsvp; ALL_VISITS = visits
  if (labels) LABELS = labels
  // RSVP 요약
  const sideAgg = { '신랑측':{teams:0,people:0}, '신부측':{teams:0,people:0} }
  rsvp.forEach(r => { const s = sideAgg[r.side] || (sideAgg[r.side]={teams:0,people:0}); s.teams++; s.people += (r.count||0) })
  const totPeople = rsvp.reduce((a,r)=>a+(r.count||0),0)
  // 방문 집계
  const pv = visits.length
  const uniqUser = new Set(visits.map(v=>v.visitor_id).filter(Boolean)).size
  const uniqIP = new Set(visits.map(v=>v.ip).filter(Boolean)).size
  const mobile = visits.filter(v=>isMobile(v.ua)).length

  $('#cards').innerHTML = [
    ['총 참석 인원', `${totPeople}<small>명</small>`],
    ['응답 팀수', `${rsvp.length}<small>팀</small>`],
    ['총 방문(PV)', `${pv}`],
    ['순 방문자', `${uniqUser}<small>명</small>`],
    ['순 IP', `${uniqIP}`],
    ['모바일 비율', `${pv?Math.round(mobile/pv*100):0}<small>%</small>`],
  ].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')

  // RSVP 요약 + 목록 (필터·삭제 지원)
  renderRsvp()

  // 기기 분포
  const devAgg = {}; visits.forEach(v=>{ const d=device(v.ua); devAgg[d]=(devAgg[d]||0)+1 })
  const devMax = Math.max(1,...Object.values(devAgg))
  $('#devices').innerHTML = Object.entries(devAgg).sort((a,b)=>b[1]-a[1]).map(([d,n])=>`
    <div class="bar-row"><div class="lbl">${d}</div><div class="track"><div class="fill" style="width:${n/devMax*100}%"></div></div><div class="n">${n}</div></div>`).join('') || '<div class="muted">방문 데이터 없음</div>'

  // 일자별 순 방문자
  const byDay = {}; visits.forEach(v=>{ const k=dayKey(v.created_at); (byDay[k]=byDay[k]||new Set()).add(v.visitor_id||v.ip) })
  const days = Object.entries(byDay).map(([k,set])=>[k,set.size]).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,14).reverse()
  const dMax = Math.max(1,...days.map(d=>d[1]))
  $('#timeline').innerHTML = days.length ? days.map(([k,n])=>`
    <div class="bar-row"><div class="lbl">${k.slice(5)}</div><div class="track"><div class="fill" style="width:${n/dMax*100}%"></div></div><div class="n">${n}</div></div>`).join('') : '<div class="muted">방문 데이터 없음</div>'

  // 최근 방문 (유저 클릭 → 이름 라벨 지정/변경)
  $('#visit-sum').textContent = `총 ${pv}건`
  $('#visit-tbl tbody').innerHTML = visits.slice(0,200).map(v=>{
    const vid = v.visitor_id || ''
    const named = !!LABELS[vid]
    const disp = named ? LABELS[vid] : (vid.slice(0,8) || '-')
    return `<tr>
    <td>${fmt(v.created_at)}</td><td>${esc(v.ip||'-')}</td><td>${device(v.ua)}</td>
    <td><button class="lbl-btn${named?' named':''}" data-vid="${esc(vid)}" title="이름 지정/변경">${esc(disp)}</button></td></tr>`
  }).join('') || `<tr><td colspan="4" class="muted">방문 없음</td></tr>`

  document.documentElement.classList.remove('autologin')
  const bt = $('#boot'); if (bt) bt.style.display = 'none'
  $('#login').style.display = 'none'; $('#dash').style.display = 'block'
}
function showLogin() {
  document.documentElement.classList.remove('autologin')
  const bt = $('#boot'); if (bt) bt.style.display = 'none'
  $('#login').style.display = 'flex'
}

async function tryLoad(pw, fromForm) {
  const r = await login(pw)
  if (r.ok) { PW = pw; sessionStorage.setItem('wc_admin_pw', pw); render(r.data); return true }
  if (fromForm) $('#login-msg').textContent = r.data.message || '로그인 실패'
  else sessionStorage.removeItem('wc_admin_pw')
  return false
}

$('#login-form').addEventListener('submit', async e => {
  e.preventDefault()
  const pw = $('#pw').value
  $('#login-btn').disabled = true; $('#login-btn').textContent = '확인 중…'; $('#login-msg').textContent = ''
  await tryLoad(pw, true)
  $('#login-btn').disabled = false; $('#login-btn').textContent = '로그인'
})
$('#logout').addEventListener('click', () => { sessionStorage.removeItem('wc_admin_pw'); location.reload() })
$('#refresh').addEventListener('click', () => { const pw = sessionStorage.getItem('wc_admin_pw'); if (pw) tryLoad(pw, false) })

// 신랑측/신부측 필터
$('#rsvp-filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return
  FILTER = chip.dataset.f
  document.querySelectorAll('#rsvp-filters .chip').forEach(c => c.classList.toggle('on', c === chip))
  renderRsvp()
})

// 삭제 (X → 확인 모달 → 예)
$('#rsvp-tbl').addEventListener('click', e => {
  const btn = e.target.closest('.del-btn'); if (!btn) return
  pendingDelId = btn.dataset.id
  $('#confirm-msg').textContent = `'${btn.dataset.name}'님 참석 응답을 삭제하겠습니까?`
  $('#confirm').classList.add('on')
})
// 방문자 이름 라벨 (유저 클릭 → 지정/변경/삭제)
$('#visit-tbl').addEventListener('click', e => {
  const btn = e.target.closest('.lbl-btn'); if (!btn) return
  pendingVid = btn.dataset.vid
  if (!pendingVid) return
  $('#name-input').value = LABELS[pendingVid] || ''
  $('#name-vid').textContent = 'ID: ' + pendingVid
  $('#namemodal').classList.add('on')
  setTimeout(() => $('#name-input').focus(), 50)
})
async function saveLabel(name) {
  const vid = pendingVid; if (!vid) return
  const save = $('#name-save'); save.disabled = true; save.textContent = '저장 중…'
  try {
    const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'label', password: PW, visitor_id: vid, name }) })
    const d = await res.json().catch(() => ({}))
    if (res.ok && d.ok) {
      if (name) LABELS[vid] = name; else delete LABELS[vid]
      render({ rsvp: ALL_RSVP, visits: ALL_VISITS, labels: LABELS })
      $('#namemodal').classList.remove('on'); pendingVid = null
    } else { alert(d.message || '저장 실패') }
  } catch { alert('저장 실패 — 네트워크 오류') }
  save.disabled = false; save.textContent = '저장'
}
$('#name-save').addEventListener('click', () => saveLabel($('#name-input').value.trim()))
$('#name-clear').addEventListener('click', () => saveLabel(''))
$('#name-cancel').addEventListener('click', () => { $('#namemodal').classList.remove('on'); pendingVid = null })
$('#namemodal').addEventListener('click', e => { if (e.target === $('#namemodal')) { $('#namemodal').classList.remove('on'); pendingVid = null } })
$('#name-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveLabel($('#name-input').value.trim()) })

$('#confirm-no').addEventListener('click', () => { $('#confirm').classList.remove('on'); pendingDelId = null })
$('#confirm-yes').addEventListener('click', async () => {
  const id = pendingDelId; if (id == null) return
  const yes = $('#confirm-yes'); yes.disabled = true; yes.textContent = '삭제 중…'
  try {
    const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', password: PW, id: Number(id) }) })
    const d = await res.json().catch(() => ({}))
    if (res.ok && d.ok) {
      ALL_RSVP = ALL_RSVP.filter(r => String(r.id) !== String(id))
      render({ rsvp: ALL_RSVP, visits: ALL_VISITS, labels: LABELS })   // 카드·요약·목록 갱신
    } else { alert(d.message || '삭제 실패') }
  } catch { alert('삭제 실패 — 네트워크 오류') }
  yes.disabled = false; yes.textContent = '예'
  $('#confirm').classList.remove('on'); pendingDelId = null
})

// 세션 자동 로그인 (로그인창 깜빡임 없이 부팅 로더 → 대시보드)
const saved = sessionStorage.getItem('wc_admin_pw')
if (saved) { tryLoad(saved, false).then(ok => { if (!ok) showLogin() }) }
else showLogin()
</script>
</body>
</html>
